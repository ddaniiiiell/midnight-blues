<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A tiny universe of memories and letters, made with love."
    />
    <meta name="theme-color" content="#171020" />
    <title>Our Little Universe</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="cursor-glow" aria-hidden="true"></div>
      <div class="ambient-stars" aria-hidden="true"></div>
      <div class="shooting-sky" aria-hidden="true"></div>

      <button
        class="initial-cluster"
        type="button"
        aria-label="Reveal a hidden D and K constellation"
        aria-pressed="false"
      >
        <svg viewBox="0 0 210 100" aria-hidden="true">
          <g class="initial-traces">
            <path d="M20 14v72M20 14h18c36 0 36 72 0 72H20" />
            <path d="M122 14v72M122 52l44-38M122 52l47 34" />
          </g>
          <g class="initial-stars">
            <circle cx="20" cy="14" r="2" />
            <circle cx="20" cy="32" r="1.6" />
            <circle cx="20" cy="50" r="1.8" />
            <circle cx="20" cy="68" r="1.5" />
            <circle cx="20" cy="86" r="2" />
            <circle cx="39" cy="14" r="1.6" />
            <circle cx="57" cy="25" r="1.8" />
            <circle cx="64" cy="43" r="1.5" />
            <circle cx="64" cy="59" r="1.8" />
            <circle cx="56" cy="76" r="1.5" />
            <circle cx="39" cy="86" r="1.8" />
            <circle cx="122" cy="14" r="2" />
            <circle cx="122" cy="33" r="1.5" />
            <circle cx="122" cy="52" r="1.9" />
            <circle cx="122" cy="70" r="1.5" />
            <circle cx="122" cy="86" r="2" />
            <circle cx="145" cy="32" r="1.6" />
            <circle cx="166" cy="14" r="1.9" />
            <circle cx="146" cy="69" r="1.6" />
            <circle cx="169" cy="86" r="1.9" />
          </g>
        </svg>
        <span>D + K, written in the stars</span>
      </button>

      <button
        class="special-sky-star midnight-star"
        type="button"
        aria-label="Open a note for after midnight"
        aria-hidden="true"
        tabindex="-1"
        disabled
      >
        <span class="special-star-core"></span>
        <span class="special-star-label">a note for this quiet hour</span>
      </button>

      <button
        class="special-sky-star return-star"
        type="button"
        aria-label="Open a welcome-back message"
        aria-hidden="true"
        tabindex="-1"
        disabled
      >
        <span class="special-star-core"></span>
        <span class="special-star-label">welcome back</span>
      </button>

      <header class="site-header">
        <a class="wordmark" href="#top" aria-label="Our little universe, home">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 3c.7 7.8 5.2 12.3 13 13-7.8.7-12.3 5.2-13 13-.7-7.8-5.2-12.3-13-13C10.8 15.3 15.3 10.8 16 3Z" />
          </svg>
          <span>ours, after midnight</span>
        </a>
        <span class="made-for" data-default-text="made for my favorite person">made for my favorite person</span>
      </header>

      <main id="top">
        <section class="hero" aria-labelledby="hero-title">
          <p class="eyebrow"><span></span> a tiny corner of the sky</p>
          <h1 id="hero-title">
            Our little<br />
            <em>universe.</em>
          </h1>
          <button class="enter-button" type="button">
            <span>look up</span>
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M10 3v13M5.5 11.5 10 16l4.5-4.5" />
            </svg>
          </button>
        </section>

        <section class="sky" aria-label="Our constellation">
          <div class="sky-heading">
            <p class="eyebrow"><span></span> our constellation</p>
          </div>

          <div class="constellation" aria-label="An interactive constellation of memories and letters">
            <svg class="constellation-lines" viewBox="0 0 1000 620" preserveAspectRatio="none" aria-hidden="true">
              <path class="constellation-path" />
            </svg>

            <div class="story-stars"></div>

            <button
              class="story-star letter-star final-star"
              style="--x: 50%; --y: 50%;"
              data-story="final-star"
              type="button"
              aria-hidden="true"
              tabindex="-1"
              disabled
            >
              <span class="star-halo"></span>
              <span class="star-core"></span>
              <span class="star-label">one final star</span>
            </button>

            <p class="final-star-notice" role="status" aria-live="polite"></p>

          </div>

          <div class="legend" aria-label="Constellation legend">
            <span><i class="memory-key"></i> memories</span>
            <span><i class="letter-key"></i> little letters</span>
          </div>
        </section>
      </main>

      <footer>
        <p>waiting for more memories</p>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3c.5 5.4 3.6 8.5 9 9-5.4.5-8.5 3.6-9 9-.5-5.4-3.6-8.5-9-9 5.4-.5 8.5-3.6 9-9Z" />
        </svg>
      </footer>
    </div>

    <dialog class="story-dialog" aria-labelledby="dialog-title">
      <button class="close-dialog" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
      </button>
      <div class="dialog-content"></div>
    </dialog>

    <template id="memory-template">
      <article class="memory-card">
        <p class="dialog-kicker">a memory for safekeeping</p>
        <div class="photo-placeholder" aria-label="Placeholder for a future photo">
          <svg viewBox="0 0 80 80" aria-hidden="true">
            <path d="M13 60 31 39l13 14 8-9 15 16M13 18h54v44H13z" />
            <circle cx="52" cy="30" r="5" />
          </svg>
          <span>your photo will live here</span>
        </div>
        <div class="memory-copy">
          <p class="memory-date">someday, somewhere lovely</p>
          <h3 id="dialog-title">A favorite moment</h3>
          <p>This star is waiting for a story only the two of you could tell.</p>
        </div>
      </article>
    </template>

    <template id="letter-template">
      <article class="letter-card">
        <p class="dialog-kicker">a little letter</p>
        <div class="envelope-wrap">
          <div class="envelope" aria-hidden="true">
            <div class="envelope-back"></div>
            <div class="letter-sheet">
              <span>for you, always</span>
              <i></i><i></i><i></i>
            </div>
            <div class="envelope-front"></div>
            <div class="envelope-flap"></div>
            <div class="wax-seal">
              <svg viewBox="0 0 24 24"><path d="M12 19s-6-3.5-6-8a3.5 3.5 0 0 1 6-2.2A3.5 3.5 0 0 1 18 11c0 4.5-6 8-6 8Z" /></svg>
            </div>
          </div>
        </div>
        <div class="letter-intro">
          <p class="memory-date">sealed with love</p>
          <h3 id="dialog-title">Open when&hellip;</h3>
          <button class="open-letter" type="button">open this letter</button>
        </div>
        <div class="letter-message" aria-live="polite">
          <p>My love,</p>
          <p>This page is waiting for the words you want her to find here.</p>
          <p class="letter-signoff">Always yours,<br /><span>your favorite person</span></p>
        </div>
      </article>
    </template>

    <template id="message-template">
      <article class="special-message-card">
        <p class="dialog-kicker">a note among the stars</p>
        <svg class="message-star" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 4c1.2 16.1 10.7 25.6 28 28-17.3 2.4-26.8 11.9-28 28C30.8 43.9 21.3 34.4 4 32 21.3 29.6 30.8 20.1 32 4Z" />
        </svg>
        <h3 id="dialog-title">Welcome back</h3>
        <p class="special-message-body"></p>
        <p class="special-message-signoff">always yours, under the same sky</p>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
